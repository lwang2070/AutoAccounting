name: Build signed APK

# 推 v 开头的 tag 自动编译并发布 Release；也可以在网页上手动触发跑一次。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # versionCode 按日期生成，固定时区避免 runner 的 UTC 和本地日期差一天
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android：它会去装一个叫 tools 的老包，
      # 新版 cmdline-tools 里已经没有了，直接报 exit code 1。
      # ubuntu-latest 自带 Android SDK 和 cmdline-tools，直接用。
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          # || true 是用来吃掉 yes 被 SIGPIPE 杀掉的 141，别删。
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # 版本号跟 tag 走，App 拿 Release 的 tag 和本地 versionName 比大小。
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          (umask 077; printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks")
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease -PappVersionName="$APP_VERSION"

      # 挡住「本该用发布密钥签、结果签成 debug」的情况：签名不对就不许发。
      - name: Verify signing certificate
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "使用 $apksigner 检查 $apk"
          raw="$("$apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$raw"
          actual="$(printf '%s\n' "$raw" \
            | grep -i 'SHA-256 digest' | head -1 \
            | tr -d ':' | tr 'A-Z' 'a-z' | awk '{print $NF}')"
          echo "实际签名指纹: $actual"
          test -n "$actual" || { echo "取不到签名指纹，停止发布"; exit 1; }
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')"
          test "$actual" = "$expected" || { echo "签名指纹不符，停止发布"; exit 1; }

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # App 里拼下载地址用的就是这个名字，别改。
      - name: Collect APK
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/AutoAccounting-$APP_VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "$GITHUB_REF_NAME" --generate-notes
